[project]
name = "prod-support-buddy"
version = "0.1.0"
description = "RAG-powered assistant for resolving production issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "chromadb>=0.5.20",
    "elasticsearch>=8.15.0,<9.0.0",
    "neo4j>=5.25.0",
    "redis>=5.2.0",
    "anthropic>=0.40.0",
    "tiktoken>=0.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "testcontainers[neo4j]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "retrieval", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
